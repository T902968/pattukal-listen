name: Deploy Pattukal Web (test)

on:
  push:
    branches: [feature/pattukal-web, feature/pattukal-web-full]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (current website unchanged, web app under /app-test/)
        run: |
          mkdir -p _site/app-test
          # The homepage always comes from main, so this deploy can never publish an older copy of it.
          git fetch --depth=1 origin main
          git show FETCH_HEAD:index.html > _site/index.html
          git show FETCH_HEAD:docs/pattukal-official-music-app-download.html > _site/pattukal-official-music-app-download.html 2>/dev/null || true
          cp -r web-app/. _site/app-test/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
