name: Pattukal Update 2 APK

on:
  push:
    branches: ["feature/pattukal-update-2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Update 2 Optimized APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pattukal
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build Debug APK (no release publishing)
        env:
          PATTUKAL_TEST_BUILD: "1"
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64FossOptimized --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          exit "${PIPESTATUS[0]}"

      - name: Show compile errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A1 "$RUNNER_TEMP/gradle.log" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -c 9000 | awk 'NR<=9{print "::error::" $0}'
          grep -E "^e: " "$RUNNER_TEMP/gradle.log" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | sed -n '10,18p' | awk '{print "::warning::" $0}'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle.log
          retention-days: 3

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: Pattukal-Update-2-Optimized-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
