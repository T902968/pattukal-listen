name: Deploy Pattukal Website

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'docs/pattukal-official-music-app-download.html'
      - '.github/workflows/deploy-pattukal-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -f docs/pattukal-official-music-app-download.html ]; then
            cp docs/pattukal-official-music-app-download.html _site/pattukal-official-music-app-download.html
          fi

      - name: Keep the web app preview under /app-test/
        run: |
          # Pages replaces the whole site on every deploy, so re-attach the web app from its branch.
          if git fetch --depth=1 origin feature/pattukal-web 2>/dev/null; then
            git archive FETCH_HEAD web-app | tar -x -C "$RUNNER_TEMP"
            mkdir -p _site/app-test
            cp -r "$RUNNER_TEMP/web-app/." _site/app-test/
          else
            echo "web app branch not found; skipping /app-test/"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
