name: Pattukal Font Test Debug APK

on:
  push:
    branches: ["font-selector-debug-apk"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build test Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pattukal
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

      - name: Build Debug APK (no release publishing)
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64FossDebug --console=plain

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: Pattukal-Font-Test-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
