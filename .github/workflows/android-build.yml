name: Pattukal Android CI

on:
  push:
    branches: ["main", "ui/paattukal-liquid-glass"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pattukal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
          rm -f "$ANDROID_HOME/ndk/27.1.12297006.zip"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Check permanent release signing
        env:
          KEYSTORE: ${{ secrets.PATTUKAL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PATTUKAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATTUKAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PATTUKAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" || { echo "Missing PATTUKAL_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing PATTUKAL_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing PATTUKAL_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing PATTUKAL_KEY_PASSWORD"; exit 1; }

      - name: Prepare permanent signing keystore
        env:
          PATTUKAL_KEYSTORE_BASE64: ${{ secrets.PATTUKAL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PATTUKAL_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          test -s keystore.jks

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.PATTUKAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATTUKAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PATTUKAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleUniversalFossRelease

      - name: Upload Pattukal APK
        uses: actions/upload-artifact@v7
        with:
          name: Pattukal-Universal-APK
          path: app/build/outputs/apk/universalFossRelease/*.apk
