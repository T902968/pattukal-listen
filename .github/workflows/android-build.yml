name: Pattukal Android CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pattukal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK licenses and install project NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"

      - name: Prepare Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -validity 10000

      - name: Build Universal FOSS Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleUniversalFossDebug

      - name: Prepare stable website download filename
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/universal/foss/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" || ! -s "$APK_PATH" ]]; then
            echo "Expected Universal FOSS debug APK was not produced."
            find app/build/outputs/apk -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_PATH" release-assets/pattukal.apk
          test -s release-assets/pattukal.apk

      - name: Upload Pattukal APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pattukal-Universal-APK
          path: release-assets/pattukal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK for the website
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pattukal latest build ${{ github.run_number }}
          body: |
            Automatically built from the main branch.
            Variant: Universal FOSS Debug APK.
            This is a debug build for testing, not a Play Store release.
          files: release-assets/pattukal.apk
          make_latest: true
          fail_on_unmatched_files: true
