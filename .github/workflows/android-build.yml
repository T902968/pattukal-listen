name: Pattukal Android CI

on:
  push:
    branches: ["main", "ui/paattukal-liquid-glass"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pattukal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

      - name: Prepare stable signing keystore
        env:
          PATTUKAL_KEYSTORE_BASE64: ${{ secrets.PATTUKAL_KEYSTORE_BASE64 }}
          PATTUKAL_STORE_PASSWORD: ${{ secrets.PATTUKAL_STORE_PASSWORD }}
          PATTUKAL_KEY_ALIAS: ${{ secrets.PATTUKAL_KEY_ALIAS }}
          PATTUKAL_KEY_PASSWORD: ${{ secrets.PATTUKAL_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$PATTUKAL_KEYSTORE_BASE64" ]; then
            echo "$PATTUKAL_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using the configured persistent Pattukal signing key."
          else
            echo "::warning::PATTUKAL_KEYSTORE_BASE64 is not configured; this build uses a temporary debug key and may not update an installed APK."
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -validity 10000
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossDebug

      - name: Upload Pattukal APK
        uses: actions/upload-artifact@v7
        with:
          name: Pattukal-Universal-APK
          path: app/build/outputs/apk/**/*.apk
