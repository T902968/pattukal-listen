name: Pattukal Android CI

on:
  push:
    branches: ["main", "ui/paattukal-liquid-glass"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Pattukal Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
          rm -f "$ANDROID_HOME/ndk/27.1.12297006.zip"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :core:testDebugUnitTest :app:testUniversalFossDebugUnitTest

      - name: Prepare Debug Keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -validity 10000
          fi

      - name: Build validation APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossDebug

      - name: Upload validation APK
        uses: actions/upload-artifact@v7
        with:
          name: Pattukal-Validation-APK
          path: app/build/outputs/apk/universalFossDebug/*.apk
