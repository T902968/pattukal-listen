name: Paattukal Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Paattukal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

      # Keep the published download on the same verified FOSS variant as Android CI.
      # The release variant currently fails AAR metadata checks because okhttp-android
      # 5.5.0 requires compileSdk 37 while this project uses AGP 9.0.0 / compileSdk 36.
      - name: Build downloadable Universal FOSS APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleUniversalFossDebug
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" || ! -s "$APK_PATH" ]]; then
            echo "Universal FOSS debug APK was not produced."
            find app/build/outputs -type f -print || true
            exit 1
          fi
          cp "$APK_PATH" pattukal.apk
          test -s pattukal.apk

      - name: Publish latest downloadable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest pattukal.apk --title "Paattukal Latest" --notes "Latest Universal FOSS debug APK built by GitHub Actions."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pattukal.apk --title "Paattukal $GITHUB_REF_NAME" --generate-notes
