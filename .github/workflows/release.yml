name: Paattukal Release

on:
  push:
    branches:
      - "main"
      - "ui/paattukal-liquid-glass"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish verified Pattukal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download exact known-good Action #49 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/T902968/pattukal-listen/actions/artifacts/11537550150/zip > artifact/run49.zip
          unzip -j artifact/run49.zip 'universalFoss/debug/*.apk' -d artifact
          APK_PATH=$(find artifact -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          mv "$APK_PATH" pattukal.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s pattukal.apk
          sha256sum pattukal.apk
          unzip -t pattukal.apk >/dev/null
          echo "Verified known-good APK archive."

      - name: Publish latest download and timestamp
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ui/paattukal-liquid-glass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPDATED_AT="$(date -u +'%Y-%m-%d %H:%M UTC')"
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest pattukal.apk \
            --title "Pattukal Latest" \
            --notes "Latest Pattukal download.\n\nAPK source: verified Action #49 baseline.\nWebsite release update time: ${UPDATED_AT}.\n\nThis workflow republishes the known-good APK without rebuilding the Android app."
