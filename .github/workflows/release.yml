name: Paattukal Release

on:
  push:
    branches:
      - "main"
      - "ui/paattukal-liquid-glass"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish Paattukal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Check permanent release signing
        env:
          KEYSTORE: ${{ secrets.PATTUKAL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PATTUKAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATTUKAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PATTUKAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" || { echo "Missing PATTUKAL_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing PATTUKAL_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing PATTUKAL_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing PATTUKAL_KEY_PASSWORD"; exit 1; }
          echo "Permanent signing configuration is present."

      - name: Prepare permanent signing keystore
        env:
          PATTUKAL_KEYSTORE_BASE64: ${{ secrets.PATTUKAL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PATTUKAL_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          test -s keystore.jks

      - name: Build permanently signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.PATTUKAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATTUKAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PATTUKAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleUniversalFossRelease
          APK_PATH=$(find app/build/outputs/apk/universalFossRelease -type f -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" pattukal.apk

      - name: Verify website APK
        run: |
          set -euo pipefail
          test -s pattukal.apk
          sha256sum pattukal.apk
          unzip -t pattukal.apk >/dev/null
          echo "APK archive verification passed."

      - name: Publish latest downloadable APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ui/paattukal-liquid-glass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest pattukal.apk --title "Paattukal Latest" --notes "Paattukal APK. Website download always points to the latest published build."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pattukal.apk --title "Paattukal $GITHUB_REF_NAME" --generate-notes
