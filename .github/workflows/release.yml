name: Paattukal Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Paattukal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.PATTUKAL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PATTUKAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATTUKAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PATTUKAL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare signing keystore
        if: steps.signing.outputs.available == 'true'
        env:
          PATTUKAL_KEYSTORE_BASE64: ${{ secrets.PATTUKAL_KEYSTORE_BASE64 }}
        run: |
          echo "$PATTUKAL_KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.PATTUKAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATTUKAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PATTUKAL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossRelease
          cp app/build/outputs/apk/universalFossRelease/*.apk pattukal.apk

      - name: Prepare debug signing keystore
        if: steps.signing.outputs.available != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build downloadable debug APK
        if: steps.signing.outputs.available != 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossDebug
          cp app/build/outputs/apk/universalFossDebug/*.apk pattukal.apk

      - name: Publish latest downloadable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest pattukal.apk --title "Paattukal Latest" --notes "Latest Paattukal APK. Signed release builds are used automatically when release signing secrets are configured."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pattukal.apk --title "Paattukal $GITHUB_REF_NAME" --generate-notes
