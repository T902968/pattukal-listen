name: Pattukal Release

on:
  push:
    branches:
      - "main"
      - "ui/paattukal-liquid-glass"
    paths-ignore:
      - 'index.html'
      - 'docs/**'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy-pattukal-website.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Serialize publication so older queued commits cannot overwrite the newest APK.
concurrency:
  group: pattukal-latest-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish APK from the same commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Wait for Android CI build for this exact commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_JSON="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/runs?head_sha=${GITHUB_SHA}&per_page=10")"
            RUN_ID="$(echo "$RUN_JSON" | jq -r '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | last | .id // empty')"
            if [ -n "$RUN_ID" ]; then
              echo "Found successful Android CI run: $RUN_ID"
              break
            fi
            echo "Waiting for successful Android CI run for commit $GITHUB_SHA (attempt $attempt/60)..."
            sleep 30
          done
          if [ -z "$RUN_ID" ]; then
            echo "No successful Android CI build was found for this commit; refusing to publish a stale APK."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download optimized APK artifact from matching build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact extracted
          RUN_ID="${{ steps.build.outputs.run_id }}"
          ARTIFACT_JSON="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID/artifacts")"
          ARTIFACT_ID="$(echo "$ARTIFACT_JSON" | jq -r '[.artifacts[] | select(.name == "Pattukal-Optimized-APK" and .expired == false)] | first | .id // empty')"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "The matching build did not publish Pattukal-Optimized-APK."
            exit 1
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$ARTIFACT_ID/zip" > artifact/apk-artifact.zip
          unzip -q artifact/apk-artifact.zip -d extracted
          APK_PATH="$(find extracted -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was found inside the optimized artifact from build $RUN_ID."
            exit 1
          fi
          cp "$APK_PATH" pattukal.apk
          APK_BYTES="$(stat -c '%s' pattukal.apk)"
          APK_MB="$(awk -v n="$APK_BYTES" 'BEGIN { printf "%.1f", n / 1048576 }')"
          echo "APK size: ${APK_MB} MiB"
          if [ "$APK_BYTES" -ge $((50 * 1024 * 1024)) ]; then
            echo "Optimized APK is 50 MiB or larger; refusing to publish it as the lightweight build."
            exit 1
          fi
          echo "APK source run: $RUN_ID"
          echo "APK source commit: $GITHUB_SHA"

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s pattukal.apk
          sha256sum pattukal.apk
          unzip -t pattukal.apk >/dev/null
          echo "APK archive verification passed."

      - name: Publish latest download and timestamp
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ui/paattukal-liquid-glass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPDATED_AT="$(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          RUN_ID="${{ steps.build.outputs.run_id }}"
          BUILD_NUMBER="$(gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" | jq -r '.run_number')"
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$APP_VERSION" ] || [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "null" ]; then
            echo "Could not determine app version or Android CI build number."
            exit 1
          fi
          APK_SIZE="$(ls -l pattukal.apk | awk '{printf "%.1f MB", $5/1048576}')"
          OLD_RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" 2>/dev/null || echo '{}')"
          OLD_COUNT="$(echo "$OLD_RELEASE" | jq -r '[.assets[]? | select(.name=="pattukal.apk") | .download_count] | add // 0')"
          OLD_CARRY="$(echo "$OLD_RELEASE" | jq -r '.body // ""' | sed -n 's/.*Downloads carried: \([0-9]*\).*/\1/p' | head -n1)"
          DOWNLOADS_CARRIED=$(( ${OLD_CARRY:-0} + ${OLD_COUNT:-0} ))
          RELEASE_NOTES="$(printf '## New features\n- GTA VI theme, now the default: animated sunset Home, a neon night-drive player background and a vinyl disc player\n- Dune Rise is the new default font\n- Pattukal Wrapped redesigned as a story: your minutes, your #1 song on a spinning record, your top artist, then a top-11 grid where you pick songs and Play, Play next or add to queue. New listeners get recommended songs\n- Time Fold now opens full screen in liquid glass, with many more songs and Play next on every card\n- Now Playing edit mode: tap the pencil to restyle the artwork, play buttons, progress bar, glow and accent colour right on the player, drag things where you like, save your own builds and reset anytime\n- Endless playback: when a song, playlist or search finishes, Pattukal keeps adding related songs automatically\n- Spotify shortcut on Home to connect and import playlists, and your Spotify playlists appear on Home\n- Winter mode (Midnight, snow, water fill) and separate Overlay effects, reachable from Settings > Appearance\n- Stronger Karaoke vocal removal\n- Pattukal Blue app icon everywhere, with blue notification accents\n\n## Bug fixes\n- Fixed the Settings Back button so you can leave Settings without the cross\n- Fixed Google login\n- Home rows no longer reshuffle or jump while you scroll or refresh\n- Removed the gesture pop-up notifications\n- Fixed the player edit button hiding under the status bar\n- Removed the Home snow globe\n\nAPK size: %s\nRelease updated: %s\n\nPattukal version: %s\nPattukal build: %s\n<!-- Downloads carried: %s -->\n' "$APK_SIZE" "$UPDATED_AT" "$APP_VERSION" "$BUILD_NUMBER" "$DOWNLOADS_CARRIED")"
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest pattukal.apk \
            --title "Pattukal Latest — Optimized 44 MB APK" \
            --target "$GITHUB_SHA" \
            --notes "$RELEASE_NOTES"
