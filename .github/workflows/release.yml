name: Paattukal Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Paattukal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true
      - name: Prepare signing keystore
        env:
          PATTUKAL_KEYSTORE_BASE64: ${{ secrets.PATTUKAL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PATTUKAL_KEYSTORE_BASE64" ]; then echo "PATTUKAL_KEYSTORE_BASE64 is required for release builds."; exit 1; fi
          echo "$PATTUKAL_KEYSTORE_BASE64" | base64 --decode > keystore.jks
      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.PATTUKAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATTUKAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PATTUKAL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/universalFossRelease/*.apk pattukal.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pattukal.apk --title "Paattukal $GITHUB_REF_NAME" --generate-notes
