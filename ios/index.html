<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pattukal">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Pattukal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Top safe area spacer -->
    <div class="safe-top"></div>

    <!-- SCREENS -->
    <main id="screens">
      <!-- HOME -->
      <section id="home" class="screen active">
        <header class="page-header">
          <h1>Pattukal</h1>
          <p class="subtitle">Your music · Your vibe</p>
        </header>
        <div class="section">
          <h2>Quick Mix</h2>
          <div class="horizontal-scroll" id="quickMix"></div>
        </div>
        <div class="section">
          <h2>Trending</h2>
          <div class="song-list" id="trendingList"></div>
        </div>
        <div class="section">
          <h2>For You</h2>
          <div class="song-list" id="forYouList"></div>
        </div>
      </section>

      <!-- SEARCH -->
      <section id="search" class="screen">
        <header class="page-header">
          <h1>Search</h1>
        </header>
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="Songs, artists, albums…" autocomplete="off">
        </div>
        <div class="song-list" id="searchResults"></div>
        <div class="empty-state" id="searchEmpty">Type to search music</div>
      </section>

      <!-- LIBRARY -->
      <section id="library" class="screen">
        <header class="page-header">
          <h1>Library</h1>
        </header>
        <div class="lib-tabs">
          <button class="lib-tab active" data-tab="liked">Liked</button>
          <button class="lib-tab" data-tab="recent">Recent</button>
          <button class="lib-tab" data-tab="playlists">Playlists</button>
        </div>
        <div class="song-list" id="libraryList"></div>
        <div class="empty-state" id="libraryEmpty">No songs yet. Like some tracks!</div>
      </section>

      <!-- FULL PLAYER -->
      <section id="player" class="screen player-screen">
        <button class="close-player" id="closePlayer">↓</button>
        <div class="player-art-wrap">
          <img id="playerArt" class="player-art" src="" alt="">
          <div class="player-art-placeholder" id="artPlaceholder">♬</div>
        </div>
        <div class="player-info">
          <h2 id="playerTitle">—</h2>
          <p id="playerArtist">—</p>
        </div>
        <div class="progress-wrap">
          <input type="range" id="progress" min="0" max="1000" value="0">
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>
        <div class="player-controls">
          <button id="btnShuffle" class="ctrl">⇄</button>
          <button id="btnPrev" class="ctrl">⏮</button>
          <button id="btnPlay" class="ctrl play">▶</button>
          <button id="btnNext" class="ctrl">⏭</button>
          <button id="btnRepeat" class="ctrl">🔁</button>
        </div>
        <div class="player-extra">
          <button id="btnLike" class="ctrl">♡</button>
          <button id="btnQueue" class="ctrl">☰</button>
        </div>
      </section>
    </main>

    <!-- MINI PLAYER -->
    <div id="miniPlayer" class="mini-player hidden">
      <img id="miniArt" class="mini-art" src="" alt="">
      <div class="mini-info">
        <div id="miniTitle" class="mini-title">—</div>
        <div id="miniArtist" class="mini-artist">—</div>
      </div>
      <button id="miniPlay" class="mini-btn">▶</button>
      <button id="miniNext" class="mini-btn">⏭</button>
    </div>

    <!-- BOTTOM NAV -->
    <nav id="bottomNav" class="bottom-nav">
      <button class="nav-btn active" data-screen="home">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-screen="search">
        <span class="nav-icon">⌕</span>
        <span>Search</span>
      </button>
      <button class="nav-btn" data-screen="library">
        <span class="nav-icon">♫</span>
        <span>Library</span>
      </button>
    </nav>

    <div class="safe-bottom"></div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
