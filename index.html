<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b12">
<meta name="description" content="Download the latest Pattukal music app for Android.">
<title>Pattukal — Download</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--text:#f7f8ff;--muted:#aab1c4;--accent:#b9a4ff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#12333c 0,transparent 38%),radial-gradient(ellipse at 85% 20%,#38245a 0,transparent 40%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.panel{width:min(650px,100%);text-align:center;padding:clamp(28px,7vw,58px);border:1px solid #ffffff1c;border-radius:32px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);box-shadow:0 28px 100px #0008,inset 0 1px #ffffff12}.logo{font-size:1.2rem;font-weight:900;letter-spacing:.12em}.logo span{color:var(--accent)}.icon{width:92px;height:92px;margin:30px auto 24px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#c4b5fd,#7c3aed);box-shadow:0 0 55px #a78bfa44;font-size:42px}.tag{display:inline-block;padding:6px 12px;border:1px solid #b9a4ff55;border-radius:999px;color:#d6ccff;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(2.3rem,8vw,4.4rem);letter-spacing:-.06em;line-height:1.02;margin:18px 0}p{color:var(--muted);max-width:470px;margin:0 auto}.download{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:28px;padding:15px 24px;border-radius:16px;background:linear-gradient(135deg,#c4b5fd,#8b5cf6);color:#100c20;text-decoration:none;font-weight:850;box-shadow:0 12px 34px #8b5cf644;transition:transform .18s ease,box-shadow .18s ease}.download:hover{transform:translateY(-2px);box-shadow:0 16px 40px #8b5cf655}.note{font-size:.9rem;margin-top:16px}footer{margin-top:34px;color:#7f879c;font-size:.8rem}@media(prefers-reduced-motion:reduce){.download{transition:none}}
</style>
</head>
<body>
<main class="panel">
<div class="logo">PATTU<span>KAL</span></div>
<div class="icon" aria-hidden="true">♫</div>
<div class="tag">Android app</div>
<h1>Your music.<br>Your space.</h1>
<p>Get the latest Pattukal Android build from the official release.</p>
<a class="download" href="https://github.com/T902968/pattukal-listen/releases/download/latest/pattukal.apk">↓ &nbsp; Download latest APK</a>
<p class="note" id="release-info" aria-live="polite">Loading the latest APK release…</p><p class="note" id="live-time" aria-live="off">Current India time: loading…</p><p class="note" id="checked-at">Release status checks automatically every minute.</p><button id="refresh" type="button" style="margin-top:10px;padding:9px 13px;border-radius:10px;border:1px solid #ffffff30;background:#ffffff0b;color:#f7f8ff;font:inherit;cursor:pointer">Check latest APK now</button>
<footer>© 2026 Pattukal · Made for music lovers</footer>
</main>
<script>
const info=document.getElementById("release-info");
const clock=document.getElementById("live-time");
const checkedAt=document.getElementById("checked-at");
function updateClock(){
  clock.textContent="Current India time: "+new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeStyle:"medium",timeZone:"Asia/Kolkata"}).format(new Date())+" IST";
}
updateClock(); setInterval(updateClock,1000);
async function loadRelease(){
 info.textContent="Checking the latest published APK…";
 checkedAt.textContent="Last checked: "+new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeStyle:"medium",timeZone:"Asia/Kolkata"}).format(new Date())+" IST";
 try {
   const response=await fetch("https://api.github.com/repos/T902968/pattukal-listen/releases/tags/latest?refresh="+Date.now(),{cache:"no-store",headers:{"Accept":"application/vnd.github+json"}});
   if(!response.ok) throw new Error("GitHub release API returned "+response.status);
   const release=await response.json();
   const asset=(release.assets||[]).find(a=>a.name==="pattukal.apk");
   if(!asset) throw new Error("APK asset not found");
   const date=release.published_at||release.updated_at||release.created_at;
   const formatted=date?new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Kolkata"}).format(new Date(date))+" IST":"time unavailable";
   info.textContent="Latest published APK · Released "+formatted+" · Size "+(asset.size/1048576).toFixed(1)+" MB";
   checkedAt.textContent="Latest release: "+release.tag_name+" · Checked "+new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeStyle:"medium",timeZone:"Asia/Kolkata"}).format(new Date())+" IST";
 } catch(e) {
   info.textContent="Release time couldn't load just now. Tap “Refresh release details” to try again.";
 }
}
document.getElementById("refresh").addEventListener("click",loadRelease);
loadRelease();
setInterval(loadRelease,60000);
</script>
</body>
</html>
